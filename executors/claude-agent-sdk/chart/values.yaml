# Default values for executor-claude-agent-sdk

# Global annotations added to all resources
global:
  annotations:
    ark.mckinsey.com/service: executor-claude-agent-sdk

# Application configuration
app:
  name: executor-claude-agent-sdk
  image:
    repository: ghcr.io/mckinsey/agents-at-scale-marketplace/executor-claude-agent-sdk
    pullPolicy: IfNotPresent
    tag: "latest"

  env:
    - name: HOST
      value: "0.0.0.0"
    - name: PORT
      value: "8000"
    - name: OTEL_INSTRUMENTATION_A2A_SDK_ENABLED
      value: "false"

  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# Additional environment variables from Kubernetes Secrets or ConfigMaps
# Use this to inject credentials (GitHub tokens, API keys, etc.) into the executor
# Example:
# extraEnvFrom:
#   - secretRef:
#       name: github-credentials
#   - secretRef:
#       name: jira-credentials
extraEnvFrom: []

# Additional volumes and volume mounts on the executor container.
# Prefer mounting rotating credentials as a FILE rather than injecting them via a
# secretKeyRef env var: env vars are resolved once at container start and go stale
# when the secret rotates, whereas a mounted secret file is kept current by kubelet.
# The CVE-remediation pr-creator relies on this for a fresh GitHub App token
# (reads /git-token/token, which rotates ~hourly).
# Example:
# extraVolumes:
#   - name: github-git-token
#     secret:
#       secretName: github-git-token
# extraVolumeMounts:
#   - name: github-git-token
#     mountPath: /git-token
#     readOnly: true
extraVolumes: []
extraVolumeMounts: []

# Service configuration
service:
  name: executor-claude-agent-sdk
  type: ClusterIP
  port: 8000
  targetPort: 8000

# HTTPRoute configuration (Gateway API - modern routing method)
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: localhost-gateway
      namespace: ark-system
  hostnames:
    - "executor-claude-agent-sdk.default.127.0.0.1.nip.io"

# Egress restriction for the executor. Applies to the standalone pod, and in
# scheduler mode to every sandbox pod via the agent-sandbox SandboxTemplate.
# Everything not listed below is denied: other namespaces, the cloud metadata
# server, and every port except those named here.
# Set enabled=false to restore unrestricted egress.
networkPolicy:
  enabled: true

  # Read the API server address and the OTEL endpoint from the cluster while
  # rendering, so neither has to be configured. This needs get on services and
  # endpointslices in the default namespace, and on the otel-environment-variables
  # secret in this namespace. Helm turns a denied read into a render error rather
  # than an empty result, so a namespace-scoped installer without those
  # permissions must set this to false and supply apiServerCIDRs/apiServerPorts,
  # plus extraEgress for a cross-namespace collector.
  autoDetect: true

  # Kubernetes API server, needed to resolve Agent/Model/Tool/MCPServer/Secret.
  # Read from the cluster at install time - both the kubernetes.default ClusterIP
  # and the backing endpoint addresses, because Kubernetes does not define whether
  # egress policy is matched before or after Service address rewriting, and it
  # differs between network plugins.
  # Renders with no cluster access - CI, GitOps - fall back to the private IPv4
  # ranges plus IPv6 ULA space on ports 443, 6443 and 8443, covering single-stack
  # clusters of either family. Set these when the API server is reached over a
  # globally routable address, or to narrow the fallback; doing so replaces both
  # detected forms with exactly what you list.
  apiServerCIDRs: []
  apiServerPorts: []

  # Public-internet egress, for the Anthropic API, WebFetch and git. Private
  # ranges and the metadata server stay blocked. Set to [] for no internet
  # egress at all, when the model is served in-cluster via Model CRD baseUrl.
  internetPorts:
    - 443

  # Pods in this namespace: the ark-broker and any MCP servers alongside.
  allowSameNamespace: true

  # Cross-namespace targets are normally opened by the target's owner:
  #   kubectl label namespace <ns> ark.mckinsey.com/executor-egress=allowed
  # This list is the escape hatch for namespaces whose labels you cannot set.
  # A cluster-internal OTEL collector needs neither - its endpoint is read from
  # the otel-environment-variables secret automatically.
  allowNamespaces: []

  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns

  # Appended verbatim. Use for NodeLocal DNSCache, non-443 outbound, or a peer
  # narrower than a whole namespace.
  extraEgress: []

  # Sandbox pods only - the standalone policy restricts egress only.
  extraIngress: []

# RBAC configuration
rbac:
  create: true

# Service account configuration
serviceAccount:
  name: executor-claude-agent-sdk-sa
  create: true

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# Health check configuration
healthCheck:
  path: /health
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5

# ExecutionEngine CRD configuration
executionEngine:
  enabled: true
  description: "Claude Agent SDK Executor - A2A server with built-in tool access and session persistence"

# Persistent volume for session data
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi

# Scheduler configuration — sandbox-based session isolation
scheduler:
  enabled: false
  image:
    repository: ghcr.io/mckinsey/agents-at-scale-marketplace/executor-claude-agent-sdk
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  config:
    sessionIdleTTL: 1800       # 30 minutes in seconds
    shutdownPolicy: Delete     # Delete or Retain
    sandboxReadyTimeout: 60    # seconds
    sandboxTemplate: claude-agent-sdk
    namespace: ""              # defaults to release namespace
    maxActiveSandboxes: 0      # 0 = unlimited; set to cap concurrent sandbox pods
    # For a hard cap independent of the scheduler, set a namespace-level ResourceQuota on pods
  sandboxTemplate:
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "1000m"
    runtimeClassName: ""
  warmPool:
    enabled: false
    replicas: 2
