{{- if .Values.scheduler.enabled }}
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: {{ .Values.scheduler.config.sandboxTemplate }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.app.name }}
  annotations:
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.networkPolicy.enabled }}
  # The chart supplies the allow-list rather than taking agent-sandbox's built-in
  # default, which blocks DNS, the K8s API and this chart's own scheduler ingress.
  networkPolicyManagement: Managed
  networkPolicy:
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app: {{ .Values.app.name }}-scheduler
        ports:
          - protocol: TCP
            port: 8000
      {{- with .Values.networkPolicy.extraIngress }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    egress:
      {{- include "claude-agent-sdk.egressRules" . | nindent 6 }}
  {{- else }}
  networkPolicyManagement: Unmanaged
  {{- end }}
  podTemplate:
    spec:
      serviceAccountName: {{ .Values.app.name }}-sandbox-sa
      automountServiceAccountToken: true
      {{- if .Values.scheduler.sandboxTemplate.runtimeClassName }}
      runtimeClassName: {{ .Values.scheduler.sandboxTemplate.runtimeClassName }}
      {{- end }}
      containers:
        - name: executor
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            {{- range .Values.app.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: otel-environment-variables
                optional: true
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.scheduler.sandboxTemplate.resources | nindent 12 }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: 8000
            initialDelaySeconds: {{ .Values.healthCheck.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.readinessProbe.periodSeconds }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
