{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.app.name }}-ark-reader
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.app.name }}
  annotations:
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
rules:
  - apiGroups: ["ark.mckinsey.com"]
    resources: ["queries", "agents", "teams", "models", "tools", "mcpservers", "executionengines"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services"]
    verbs: ["get"]
  {{- if .Values.rbac.impersonation.enabled }}
  # A Query may name a ServiceAccount in spec.serviceAccount, which the SDK uses
  # to resolve the agent, model and their secrets. Without this the resolution
  # fails rather than falling back to this executor's own identity.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["impersonate"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.app.name }}-ark-reader
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.app.name }}
  annotations:
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Values.app.name }}-ark-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
