# Default values for executor-openai-responses

# Global annotations added to all resources
global:
  annotations:
    ark.mckinsey.com/service: executor-openai-responses

# Application configuration
app:
  name: executor-openai-responses
  image:
    repository: ghcr.io/mckinsey/agents-at-scale-marketplace/executor-openai-responses
    pullPolicy: IfNotPresent
    # tag: defaults to appVersion

  env:
    - name: HOST
      value: "0.0.0.0"
    - name: PORT
      value: "8000"
    - name: OTEL_INSTRUMENTATION_A2A_SDK_ENABLED
      value: "false"

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Service configuration
service:
  name: executor-openai-responses
  type: ClusterIP
  port: 8000
  targetPort: 8000

# HTTPRoute configuration (Gateway API - modern routing method)
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: localhost-gateway
      namespace: ark-system
  hostnames:
    - "executor-openai-responses.default.127.0.0.1.nip.io"

# RBAC configuration
rbac:
  create: true
  # Service account impersonation for per-query RBAC scoping.
  #
  # A Query may name a ServiceAccount in spec.serviceAccount; the executor then
  # resolves that query's agent, model and secrets as that account instead of its
  # own. Queries that do not set the field are unaffected.
  impersonation:
    # ServiceAccounts this executor is allowed to assume, as an explicit
    # allow-list. Empty (the default) grants nothing, so a query naming a
    # ServiceAccount fails until an operator opts in by listing it here.
    #
    #   serviceAccountNames:
    #     - tenant-a-sa
    #     - tenant-b-sa
    serviceAccountNames: []

    # Allow assuming ANY ServiceAccount in the namespace instead of the list
    # above. Anything that can reach this pod's token can then act as any account
    # in the namespace, including a privileged one — and for the sandbox that
    # token is mounted alongside model-directed code. Prefer serviceAccountNames.
    allowAny: false

# Service account configuration
serviceAccount:
  name: executor-openai-responses-sa
  create: true

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# Health check configuration
healthCheck:
  path: /health
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5

# ExecutionEngine CRD configuration
executionEngine:
  enabled: true
  description: "OpenAI Responses API Executor - A2A server with built-in tool support, multi-turn threading, and a /files upload UI backed by the OpenAI Files API"

# Persistent volume for session data (stores previous_response_id per conversation)
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

# File listing scope. When true, GET /v1/files only returns files uploaded
# through this executor for the requesting agent — the raw upstream listing
# on a shared gateway key is the entire org's uploads (can be huge and slow).
# See README.
files:
  uploadedOnly: true
