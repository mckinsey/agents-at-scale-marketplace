AWSTemplateFormatVersion: '2010-09-09'
Description: Telegram API reverse proxy for Ark channel development

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Telegram proxy - HTTP inbound
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      SecurityGroupIds:
        - !GetAtt SecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: ark-telegram-proxy
      UserData:
        Fn::Base64: |
          #!/bin/bash
          dnf install -y nginx
          cat > /etc/nginx/conf.d/telegram-proxy.conf << 'NGINX'
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass https://api.telegram.org;
                  proxy_ssl_server_name on;
                  proxy_set_header Host api.telegram.org;
                  proxy_read_timeout 120s;
                  proxy_connect_timeout 10s;
              }
          }
          NGINX
          rm -f /etc/nginx/conf.d/default.conf 2>/dev/null
          systemctl enable nginx
          systemctl start nginx

Outputs:
  ProxyUrl:
    Description: Telegram API proxy URL
    Value: !Sub "http://${Instance.PublicIp}"
  InstanceId:
    Description: EC2 instance ID (for cleanup)
    Value: !Ref Instance
