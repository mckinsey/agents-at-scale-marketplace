[project]
name = "telegram-channel"
version = "0.1.0"
description = "Telegram channel for Ark - connects agents to Telegram"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.0",
    "kubernetes>=31.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_channel"]

[project.scripts]
telegram-channel = "telegram_channel.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
