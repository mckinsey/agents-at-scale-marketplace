name: E2E - executor-openai-responses

on:
  pull_request:
    branches: ["main"]
    paths:
      - "executors/openai-responses/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-executor-openai-responses:
    runs-on: ubuntu-24.04
    if: ${{ !github.event.pull_request.head.repo.fork }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup K3s cluster
        uses: k3s-io/k3s-action@v1
        with:
          k3s-version: v1.32.3+k3s1
          args: "--disable=traefik --disable=metrics-server"

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          sudo cat /etc/rancher/k3s/k3s.yaml | sed "s/127.0.0.1/$(hostname -I | awk '{print $1}')/g" > ~/.kube/config
          kubectl get nodes

      - name: Install cert-manager
        run: |
          helm repo add jetstack https://charts.jetstack.io --force-update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait --timeout=5m

      - name: Install Gateway API CRDs
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.3.0/standard-install.yaml

      - name: Install Ark core
        run: |
          helm upgrade --install ark-controller \
            oci://ghcr.io/mckinsey/agents-at-scale-ark/charts/ark-controller \
            --namespace ark-system \
            --create-namespace \
            --set rbac.enable=true \
            --wait --timeout=5m

          helm upgrade --install ark-tenant \
            oci://ghcr.io/mckinsey/agents-at-scale-ark/charts/ark-tenant \
            --wait --timeout=3m

          helm upgrade --install ark-api \
            oci://ghcr.io/mckinsey/agents-at-scale-ark/charts/ark-api \
            --wait --timeout=5m

      - name: Wait for Ark webhook
        run: |
          kubectl wait --for=condition=available -n ark-system \
            deployment/ark-controller --timeout=180s

      - name: Deploy executor-openai-responses
        run: |
          helm upgrade --install executor-openai-responses \
            executors/openai-responses/chart \
            --namespace default \
            --set app.image.repository=ghcr.io/mckinsey/agents-at-scale-marketplace/executor-openai-responses \
            --set app.image.tag=latest \
            --wait --timeout=5m

      - name: Wait for executor to be ready
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=executor-openai-responses \
            -n default --timeout=120s

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          pip install pytest pytest-xdist requests
          cd executors/openai-responses
          pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true

      - name: Run e2e tests
        env:
          CICD_OPENAI_API_KEY: ${{ secrets.CICD_OPENAI_API_KEY }}
          CICD_OPENAI_BASE_URL: ${{ secrets.CICD_OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          ARK_NAMESPACE: default
          ARK_QUERY_TIMEOUT: "300"
          PYTHONPATH: ${{ github.workspace }}/executors/openai-responses/tests/e2e
        run: |
          cd executors/openai-responses/tests/e2e
          pytest test_openai_responses.py \
            -v --tb=short --log-cli-level=INFO \
            -m "executor and marketplace"

      - name: Collect cluster logs
        if: always()
        run: |
          kubectl cluster-info dump \
            --all-namespaces \
            --output-directory=/tmp/cluster-logs

      - name: Upload cluster logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-logs-e2e-executor-${{ github.sha }}
          path: /tmp/cluster-logs
          retention-days: 7
