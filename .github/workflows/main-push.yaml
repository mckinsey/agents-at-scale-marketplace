name: Main Branch Push

on:
  push:
    branches:
      - main
  
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write
  packages: write

jobs:
  validate-docs:
    name: Validate Documentation
    uses: ./.github/workflows/_reusable-docs-cicd.yaml

  jfrog-xray-scan:
    name: JFrog Xray Dependency Scan
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level block entirely, so every
    # scope this job needs must be listed here: issues:write to open the CVE
    # issue, actions:read to download the previous scan artifact.
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      XRAY_WATCH_NAME: 'ark-marketplace-security-watch'
      SCAN_JSON: "xray-scan-agents-at-scale-marketplace-${{ github.run_number }}.json"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Export uv lockfiles to requirements.txt
        shell: bash
        run: |
          # jf audit reads requirements.txt for Python. Without this it resolves
          # uv projects fresh from PyPI and misses the locked versions.
          for dir in agents/noah services/ark-sandbox executors/claude-agent-sdk; do
            if [ ! -f "$dir/uv.lock" ]; then
              echo "::warning::skipping $dir (no uv.lock)"
              continue
            fi
            echo "Exporting $dir"
            if ! (cd "$dir" && uv export --format requirements-txt --no-hashes --no-dev --no-sources > requirements.txt); then
              echo "::warning::uv export failed for $dir; jf audit will fall back to pyproject.toml"
              rm -f "$dir/requirements.txt"
            fi
          done

      - name: Run JFrog Xray scan
        uses: ./.github/actions/jfrog-xray-scan
        with:
          github_repo: ${{ github.repository }}
          build_name: 'agents-at-scale-marketplace'
          build_number: ${{ github.run_number }}
          watch_name: ${{ env.XRAY_WATCH_NAME }}
          jfrog_user: ${{ secrets.DOCKER_CICD_CACHE_REGISTRY_USERNAME }}
          jfrog_password: ${{ secrets.DOCKER_CICD_CACHE_REGISTRY_PASSWORD }}
          jfrog_url: ${{ vars.JFROG_PLATFORM_URL }}

      - name: Download baseline scan from last successful main run
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          LAST_RUN_ID=$(gh api \
            "/repos/$TARGET_REPO/actions/workflows/main-push.yaml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')

          BASELINE=""
          if [ -n "$LAST_RUN_ID" ]; then
            echo "Last successful main run: $LAST_RUN_ID"
            mkdir -p artifacts
            if gh run download "$LAST_RUN_ID" --repo "$TARGET_REPO" \
                 --pattern "xray-scan-results-agents-at-scale-marketplace-*" \
                 --dir ./artifacts; then
              # find, not **: globstar is off by default in non-interactive bash
              BASELINE=$(find ./artifacts -name 'xray-scan-*.json' -type f | head -1)
            fi
          fi

          if [ -n "$BASELINE" ]; then
            echo "Baseline: $BASELINE"
            cp "$BASELINE" last-main-scan.json
          else
            echo "::warning::no baseline scan found; every violation counts as new"
            echo '[]' > last-main-scan.json
          fi

      - name: Detect new violations
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          WHITELIST=".github/actions/jfrog-xray-scan/tolerated_violations.txt"

          # The scan step runs with continue-on-error, and its `>` redirect
          # creates the file before jf runs. So a failed scan leaves an empty or
          # truncated file behind. Without this guard the diff below finds no
          # violations and the job passes green having scanned nothing.
          if [ ! -s "$SCAN_JSON" ] || ! jq -e 'type == "array"' "$SCAN_JSON" >/dev/null 2>&1; then
            echo "::error::$SCAN_JSON is empty or not valid Xray output; the scan did not complete"
            exit 1
          fi

          # Exact match on the first field of each non-comment whitelist line.
          # Substring matching would let an entry for XRAY-1000 silently
          # tolerate XRAY-100012.
          is_tolerated() {
            awk '!/^[[:space:]]*#/ {print $1}' "$WHITELIST" | grep -qxF "$1"
          }

          jq -r '.[].violations[]?.issue_id' last-main-scan.json | sort -u > old.txt
          jq -r '.[].violations[]?.issue_id' "$SCAN_JSON" | sort -u > new.txt

          NEW_VIOLATIONS=$(comm -13 old.txt new.txt)
          REMOVED_VIOLATIONS=$(comm -23 old.txt new.txt)

          if [ -n "$REMOVED_VIOLATIONS" ]; then
            echo "Violations no longer present:"
            echo "$REMOVED_VIOLATIONS"
          fi

          if [ -z "$NEW_VIOLATIONS" ]; then
            echo "No new violations."
            exit 0
          fi

          BLOCKING=""
          while read -r violation; do
            [ -z "$violation" ] && continue
            if is_tolerated "$violation"; then
              echo "Tolerated (in whitelist): $violation"
            else
              echo "New violation: $violation"
              BLOCKING="${BLOCKING}${violation}"$'\n'
            fi
          done <<< "$NEW_VIOLATIONS"

          if [ -n "$BLOCKING" ]; then
            # Published for the next step, which opens the CVE issue even though
            # this step fails the job.
            {
              echo "NEW_VIOLATIONS<<XRAY_EOF"
              printf '%s' "$BLOCKING"
              echo "XRAY_EOF"
            } >> "$GITHUB_ENV"

            echo "::error::new unwhitelisted Xray violations found"
            printf '%s' "$BLOCKING"
            exit 1
          fi

          echo "All new violations are whitelisted."

      - name: Create GitHub issue for new CVE violations
        if: always() && env.NEW_VIOLATIONS != ''
        uses: ./.github/actions/create-cve-issues
        with:
          new_violations: ${{ env.NEW_VIOLATIONS }}
          scan_json: ${{ env.SCAN_JSON }}

  build-docker-images:
    name: Build Docker Image - ${{ matrix.service.name }}
    strategy:
      matrix:
        service:
          - { name: noah, path: agents/noah }
          - { name: ark-sandbox, path: services/ark-sandbox }
          - { name: file-api, path: services/file-gateway/services/file-api }
          - { name: filesystem-mcp-server, path: mcps/filesystem-mcp-server }
          - { name: cobol-demo-data-seeder, path: demos/cobol-modernization-bundle/examples/data }
          - { name: executor-langchain, path: executors/langchain }
          - { name: executor-claude-agent-sdk, path: executors/claude-agent-sdk }
          - { name: executor-openai-responses, path: executors/openai-responses }
    uses: ./.github/workflows/_reusable-docker-cicd.yaml
    with:
      service-name: ${{ matrix.service.name }}
      service-path: ${{ matrix.service.path }}
      push-to-registry: false

  validate-charts:
    name: Validate Chart - ${{ matrix.chart.name }}
    strategy:
      matrix:
        chart:
          # disable langfuse deployment tests for PRs to avoid hitting 5m limit
          - { name: langfuse, path: services/langfuse, namespace: langfuse, run-deployment-test: false }
          # disable phoenix deployment tests for PRs to avoid hitting 5m limit
          - { name: phoenix, path: services/phoenix, namespace: phoenix, run-deployment-test: false }
          # disable a2a-inspector deployment tests for PRs to avoid hitting 5m limit
          - { name: a2a-inspector, path: services/a2a-inspector, namespace: default, run-deployment-test: false }
          # disable mcp-inspector deployment tests for PRs to avoid hitting 5m limit
          - { name: mcp-inspector, path: services/mcp-inspector, namespace: default, run-deployment-test: false }
          # disable ark-sandbox deployment tests for PRs to avoid hitting 5m limit
          - { name: ark-sandbox, path: services/ark-sandbox, namespace: default, run-deployment-test: false }
          # disable noah deployment tests for PRs to avoid hitting 5m limit
          - { name: noah, path: agents/noah, namespace: noah, run-deployment-test: false }
          # disable argo-make-author deployment tests for PRs to avoid hitting 5m limit
          - { name: argo-make-author, path: agents/argo-make-author, namespace: default, run-deployment-test: false }
          # disable kyc-demo-bundle deployment tests for PRs to avoid hitting 5m limit
          - { name: kyc-demo-bundle, path: demos/kyc-demo-bundle, namespace: default, run-deployment-test: false }
          # disable file-gateway deployment tests for PRs to avoid hitting 5m limit
          - { name: file-gateway, path: services/file-gateway, namespace: default, run-deployment-test: false }
          # disable filesystem-mcp-server deployment tests for PRs to avoid hitting 5m limit
          - { name: filesystem-mcp-server, path: mcps/filesystem-mcp-server, namespace: default, run-deployment-test: false }
          # disable kubernetes-mcp-server deployment tests for PRs to avoid hitting 5m limit
          - { name: kubernetes-mcp-server, path: mcps/kubernetes-mcp-server, namespace: default, run-deployment-test: false }
          # disable cobol-modernization-bundle deployment tests for PRs to avoid hitting 5m limit
          - { name: cobol-modernization-bundle, path: demos/cobol-modernization-bundle, namespace: default, run-deployment-test: false }
          # disable executor-langchain deployment tests for PRs to avoid hitting 5m limit
          - { name: executor-langchain, path: executors/langchain, namespace: default, run-deployment-test: false }
          # disable executor-claude-agent-sdk deployment tests for PRs to avoid hitting 5m limit
          - { name: executor-claude-agent-sdk, path: executors/claude-agent-sdk, namespace: default, run-deployment-test: false }
          # disable executor-openai-responses deployment tests for PRs to avoid hitting 5m limit
          - { name: executor-openai-responses, path: executors/openai-responses, namespace: default, run-deployment-test: false }
    uses: ./.github/workflows/_reusable-charts-cicd.yaml
    with:
      chart-name: ${{ matrix.chart.name }}
      chart-path: ${{ matrix.chart.path }}
      chart-namespace: ${{ matrix.chart.namespace }}
      upload-artifact: false
      run-deployment-test: ${{ matrix.chart.run-deployment-test }}

  release-please:
    name: Create Release
    needs: [validate-docs, validate-charts, build-docker-images]
    runs-on: ubuntu-24.04
    outputs:
      released: ${{ steps.release-please.outputs.release_created }}
      tag: ${{ steps.release-please.outputs.tag_name }}
      rp_outputs: ${{ toJSON(steps.release-please.outputs) }}
    
    env:
      ACT: false # Default value for ACT
    
    steps:
      - name: Skip Release (Running Locally)
        if: ${{ env.ACT == 'true' }}
        run: |
          echo "ℹ️  Skipping release when running locally with 'act'"
          echo "   Release creation requires GitHub tokens that are not available locally"
      
      - name: Run Release Please
        if: ${{ env.ACT == 'false' && github.ref == 'refs/heads/main' }}
        uses: googleapis/release-please-action@v4
        id: release-please
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  # Deploy documentation to GitHub Pages after successful release
  build-docs-for-pages:
    name: Build Documentation for GitHub Pages
    needs: [release-please]
    if: ${{ needs.release-please.outputs.released == 'true' }}
    uses: ./.github/workflows/_reusable-docs-cicd.yaml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      upload-artifact: true
      setup-github-pages: true

  deploy-docs-to-pages:
    name: Deploy Documentation to GitHub Pages
    needs: [release-please, build-docs-for-pages]
    if: ${{ needs.release-please.outputs.released == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  log-rp-outputs:
    name: Log Release Please Outputs
    needs: [release-please]
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Display All Release Please Outputs
        run: |
          echo "📋 Complete Release Please Outputs:"
          echo '${{ needs.release-please.outputs.rp_outputs }}' | jq '.'

  push-docker-images:
    name: Push Docker Image - ${{ matrix.service.name }}
    needs: [release-please]
    if: ${{ needs.release-please.outputs.released == 'true' }}
    strategy:
      matrix:
        service:
          - { name: noah, path: agents/noah }
          - { name: ark-sandbox, path: services/ark-sandbox }
          - { name: file-api, path: services/file-gateway/services/file-api }
          - { name: filesystem-mcp-server, path: mcps/filesystem-mcp-server }
          - { name: cobol-demo-data-seeder, path: demos/cobol-modernization-bundle/examples/data }
          - { name: executor-langchain, path: executors/langchain }
          - { name: executor-claude-agent-sdk, path: executors/claude-agent-sdk }
          - { name: executor-openai-responses, path: executors/openai-responses }
    uses: ./.github/workflows/_reusable-docker-cicd.yaml
    with:
      service-name: ${{ matrix.service.name }}
      service-path: ${{ matrix.service.path }}
      push-to-registry: ${{ fromJSON(needs.release-please.outputs.rp_outputs)[format('{0}--release_created', matrix.service.path)] == 'true' }}
      image-tag: ${{ fromJSON(needs.release-please.outputs.rp_outputs)[format('{0}--version', matrix.service.path)] || 'latest' }}

  deploy-charts:
    name: Deploy Chart - ${{ matrix.chart.name }}
    needs: [release-please, validate-charts, push-docker-images]
    if: ${{ needs.release-please.outputs.released == 'true' }}
    strategy:
      matrix:
        chart:
          - { name: langfuse, path: services/langfuse, namespace: langfuse }
          - { name: phoenix, path: services/phoenix, namespace: phoenix }
          - { name: a2a-inspector, path: services/a2a-inspector, namespace: default }
          - { name: mcp-inspector, path: services/mcp-inspector, namespace: default }
          - { name: ark-sandbox, path: services/ark-sandbox, namespace: default }
          - { name: noah, path: agents/noah, namespace: noah }
          - { name: argo-make-author, path: agents/argo-make-author, namespace: default }
          - { name: kyc-demo-bundle, path: demos/kyc-demo-bundle, namespace: default }
          - { name: file-gateway, path: services/file-gateway, namespace: default }
          - { name: filesystem-mcp-server, path: mcps/filesystem-mcp-server, namespace: default }
          - { name: kubernetes-mcp-server, path: mcps/kubernetes-mcp-server, namespace: default }
          - { name: cobol-modernization-bundle, path: demos/cobol-modernization-bundle, namespace: default }
          - { name: executor-langchain, path: executors/langchain, namespace: default }
          - { name: executor-claude-agent-sdk, path: executors/claude-agent-sdk, namespace: default }
          - { name: executor-openai-responses, path: executors/openai-responses, namespace: default }
    uses: ./.github/workflows/_reusable-charts-cicd.yaml
    with:
      chart-name: ${{ matrix.chart.name }}
      chart-path: ${{ matrix.chart.path }}
      chart-namespace: ${{ matrix.chart.namespace }}
      upload-artifact: ${{ fromJSON(needs.release-please.outputs.rp_outputs)[format('{0}--release_created', matrix.chart.path)] == 'true' }}
      deploy-to-registry: ${{ fromJSON(needs.release-please.outputs.rp_outputs)[format('{0}--release_created', matrix.chart.path)] == 'true' }}
      run-deployment-test: false # deployments already tested in validate-charts job
      release-tag: ${{ fromJSON(needs.release-please.outputs.rp_outputs)[format('{0}--tag_name', matrix.chart.path)] }}

  xray-container-scan:
    name: JFrog Xray Container Scan - ${{ matrix.service.name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Deliberately not `needs: build-docker-images`: that job runs with
    # push-to-registry: false, which builds and discards the image, so there is
    # nothing to pull afterwards. This job builds its own single-platform image
    # with load: true so jf docker scan can read it from the local daemon.
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: noah, path: agents/noah }
          - { name: ark-sandbox, path: services/ark-sandbox }
          - { name: file-api, path: services/file-gateway/services/file-api }
          - { name: filesystem-mcp-server, path: mcps/filesystem-mcp-server }
          - { name: cobol-demo-data-seeder, path: demos/cobol-modernization-bundle/examples/data }
          - { name: executor-langchain, path: executors/langchain }
          - { name: executor-claude-agent-sdk, path: executors/claude-agent-sdk }
          - { name: executor-openai-responses, path: executors/openai-responses }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.path }}
          file: ${{ matrix.service.path }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: xray-scan/${{ matrix.service.name }}:${{ github.sha }}
          # Read-only reuse of the cache build-docker-images writes for the same
          # image in this run. No cache-to, to avoid two jobs writing one scope.
          cache-from: type=gha,scope=${{ matrix.service.name }}-linux-amd64

      - name: Scan image
        uses: ./.github/actions/jfrog-xray-container-scan
        with:
          image: xray-scan/${{ matrix.service.name }}:${{ github.sha }}
          image_name: ${{ matrix.service.name }}
          jfrog_user: ${{ secrets.DOCKER_CICD_CACHE_REGISTRY_USERNAME }}
          jfrog_password: ${{ secrets.DOCKER_CICD_CACHE_REGISTRY_PASSWORD }}
          jfrog_url: ${{ vars.JFROG_PLATFORM_URL }}
