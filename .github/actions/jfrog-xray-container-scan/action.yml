name: 'JFrog Xray Container Scan'
description: 'Pulls and scans a container image using JFrog Xray'
# Report-only, mirroring agents-at-scale-ark: findings reach the summary and an
# artifact, never the exit code. To gate later, read violations_count — Critical only,
# since base images carry unfixable Highs. Check scan_completed first: a failed scan
# reports no counts at all, which must not be read as a clean image.
inputs:
  image:
    description: 'Full image reference in a registry the caller is logged in to'
    required: true
  image_name:
    description: 'Short image name used for artifact naming (e.g., noah)'
    required: true
  jfrog_user:
    description: 'JFrog username'
    required: true
  jfrog_password:
    description: 'JFrog password'
    required: true
  jfrog_url:
    description: 'JFrog URL'
    required: true
outputs:
  scan_file:
    description: 'Path to the scan results JSON file'
    value: ${{ steps.scan.outputs.scan_file }}
  violations_count:
    description: 'Number of vulnerabilities found, empty if the scan did not complete'
    value: ${{ steps.parse-scan.outputs.violations_count }}
  scan_completed:
    description: 'true when the scan produced valid output; false otherwise'
    value: ${{ steps.parse-scan.outputs.scan_completed }}
runs:
  using: 'composite'
  steps:
    # buildx pushes straight to the registry without loading into the local daemon,
    # so the image has to be pulled back before jf docker scan can read it.
    - name: Pull container image
      shell: bash
      run: |
        echo "Pulling container image: ${{ inputs.image }}"
        docker pull ${{ inputs.image }}

    - name: Setup JFrog CLI
      uses: jfrog/setup-jfrog-cli@v4
      env:
        JF_USER: ${{ inputs.jfrog_user }}
        JF_PASSWORD: ${{ inputs.jfrog_password }}
        JF_URL: ${{ inputs.jfrog_url }}

    - name: Scan container image
      id: scan
      continue-on-error: true
      shell: bash
      run: |
        SCAN_FILE="xray-container-scan-${{ inputs.image_name }}.json"
        echo "scan_file=$SCAN_FILE" >> $GITHUB_OUTPUT

        echo "Scanning container image: ${{ inputs.image }}"
        jf docker scan ${{ inputs.image }} --format json > "$SCAN_FILE"

    - name: Parse scan results
      id: parse-scan
      if: always()
      shell: bash
      run: |
        SCAN_FILE="xray-container-scan-${{ inputs.image_name }}.json"

        # A failed scan leaves an empty or invalid file behind. Without this the
        # summary below reports all zeros, which reads as a clean image — and
        # nothing downstream gates this scan, so no one would notice.
        if [ ! -s "$SCAN_FILE" ] || ! jq -e 'type == "array"' "$SCAN_FILE" >/dev/null 2>&1; then
          echo "::warning::container scan for ${{ inputs.image_name }} did not complete"
          {
            echo "scan_completed=false"
            echo "violations_count="
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Container Scan: ${{ inputs.image_name }}"
            echo ""
            echo "The scan did not complete, so there are no results to report."
            echo "See the \`Scan container image\` step for the underlying error."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        echo "scan_completed=true" >> "$GITHUB_OUTPUT"

        VULN_COUNT=$(jq '[.[] | select(.vulnerabilities != null) | .vulnerabilities | length] | add // 0' "$SCAN_FILE" 2>/dev/null || echo "0")

        echo "Vulnerabilities found in ${{ inputs.image_name }}: $VULN_COUNT"
        echo "violations_count=$VULN_COUNT" >> $GITHUB_OUTPUT

        # Unknown severities sort last (5) so they never outrank a Critical.
        TABLE=$(jq -r '
          .[]
          | select(.vulnerabilities != null) | .vulnerabilities[]?
          | {
              issue_id: (.issue_id // "N/A"),
              component_ids: (
                if (.components and (.components | length > 0))
                then (.components | keys)
                else []
                end
              ),
              severity: (.severity // "Unknown"),
              severity_order: (
                if .severity == "Critical" then 1
                elif .severity == "High" then 2
                elif .severity == "Medium" then 3
                elif .severity == "Low" then 4
                else 5
                end
              ),
              cves: (
                if (.cves and (.cves | type == "array" and length > 0))
                then (.cves | map(.cve))
                else []
                end
              )
            }
        ' "$SCAN_FILE" 2>/dev/null | jq -r -s '
          group_by(.issue_id)
          | map({
              issue_id: .[0].issue_id,
              components: (map(.component_ids[]) | unique | join(",")),
              severity: (map(.severity) | unique | join(",")),
              severity_order: .[0].severity_order,
              cves: (map(.cves[]) | unique | join(","))
            })
          | sort_by(.severity_order)
          | .[]
          | [.issue_id, .components, .severity, .cves]
          | @tsv
        ' 2>/dev/null || echo "")

        CRITICAL=$(jq '[.[].vulnerabilities[]? | select(.severity == "Critical")] | length' "$SCAN_FILE" 2>/dev/null || echo "0")
        HIGH=$(jq '[.[].vulnerabilities[]? | select(.severity == "High")] | length' "$SCAN_FILE" 2>/dev/null || echo "0")
        MEDIUM=$(jq '[.[].vulnerabilities[]? | select(.severity == "Medium")] | length' "$SCAN_FILE" 2>/dev/null || echo "0")
        LOW=$(jq '[.[].vulnerabilities[]? | select(.severity == "Low")] | length' "$SCAN_FILE" 2>/dev/null || echo "0")
        UNKNOWN=$(jq '[.[].vulnerabilities[]? | select(.severity == null or .severity == "" or (.severity != "Critical" and .severity != "High" and .severity != "Medium" and .severity != "Low"))] | length' "$SCAN_FILE" 2>/dev/null || echo "0")

        {
          echo "### Container Scan: ${{ inputs.image_name }}"
          echo ""
          echo "#### Summary"
          echo ""
          echo "| Total | 🔴 Critical | 🟠 High | 🟡 Medium | 🟢 Low | ⚪ Unknown |"
          echo "|-------|-------------|---------|-----------|--------|----------|"
          echo "| $VULN_COUNT | $CRITICAL | $HIGH | $MEDIUM | $LOW | $UNKNOWN |"
          echo ""
          echo "<details>"
          echo "<summary>Details</summary>"
          echo ""
          echo "| ID | Affected Component | Severity | CVEs |"
          echo "|----|-------------------|----------|------|"
        } >> $GITHUB_STEP_SUMMARY

        if [ -n "$TABLE" ]; then
          # -F'\t' keeps columns aligned when a component name contains a space.
          echo "$TABLE" | awk -F'\t' '{print "| " $1 " | " $2 " | " $3 " | " $4 " |"}' >> $GITHUB_STEP_SUMMARY
        else
          echo "| No vulnerabilities found | - | - | - |" >> $GITHUB_STEP_SUMMARY
        fi

        {
          echo ""
          echo "</details>"
        } >> $GITHUB_STEP_SUMMARY

    - name: Upload scan results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: xray-container-scan-${{ inputs.image_name }}
        path: xray-container-scan-${{ inputs.image_name }}.json
        retention-days: 30

    - name: Cleanup local image
      if: always()
      shell: bash
      run: |
        docker rmi ${{ inputs.image }} 2>/dev/null || true
