fullnameOverride: "file-gateway"

global:
  annotations:
    ark.mckinsey.com/service: file-gateway

storage:
  enabled: true
  size: 1Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  pvcName: ""

httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: localhost-gateway
      namespace: ark-system
  hostnames:
    - "file-gateway.127.0.0.1.nip.io"
    - "file-gateway.default.127.0.0.1.nip.io"

versitygw:
  enabled: true
  replicaCount: 1

  # Storage backend for the gateway:
  #   posix - store objects on the shared PVC at config.dataPath (default)
  #   s3    - proxy to an existing S3 service (e.g. real AWS S3). No PVC is
  #           provisioned or mounted in this mode (storage.enabled is ignored when
  #           backend=s3). Requires filesystemMcp.enabled=false.
  backend: posix

  image:
    repository: ghcr.io/versity/versitygw
    pullPolicy: IfNotPresent
    tag: "latest"

  serviceAccount:
    create: true
    name: ""
    # Annotations for the VersityGW ServiceAccount, e.g. IRSA role binding:
    #   eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<role>
    # Required to actually use s3Backend.allowDefaultCredentialChain=true with
    # IRSA / pod identity (the default credential chain reads the role from the SA).
    annotations: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 80

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  config:
    region: "us-east-1"
    port: "7070"
    dataPath: "/data"

  # Used only when backend: s3 - upstream S3 service the gateway proxies to.
  s3Backend:
    # Upstream S3 endpoint. Empty = AWS default (https://s3.<region>.amazonaws.com).
    endpoint: ""
    region: "us-east-1"
    # Force path-style addressing to the upstream (VGW_S3_USE_PATH_STYLE). AWS uses
    # virtual-host addressing (the VersityGW default, false); set true for
    # S3-compatible providers such as MinIO or Ceph RGW that require path-style.
    usePathStyle: false
    # Optional secret holding long-lived upstream credentials as keys:
    #   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
    # These are passed to the gateway as VGW_S3_ACCESS_KEY / VGW_S3_SECRET_KEY.
    # Leave empty to use the pod's AWS default credential chain (IRSA / pod identity)
    # for auto-rotating / temporary credentials; you must then also set
    # allowDefaultCredentialChain=true (see below) and annotate the service account.
    credentialsSecret: ""
    # Guard: when credentialsSecret is empty, install fails unless this is true.
    # Prevents silently deploying with no upstream credentials (pod reports Ready
    # but every S3 request 403s). Set true only when using IRSA / pod identity.
    allowDefaultCredentialChain: false

  s3SecretName: "file-gateway-s3-credentials"

  createSecret: true
  s3Credentials:
    accessKeyId: "admin"
    secretAccessKey: "change-me"

filesystemMcp:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/mckinsey/agents-at-scale-ark/filesystem-mcp-server
    pullPolicy: IfNotPresent
    tag: "latest"

  serviceAccount:
    create: true
    name: ""

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 80

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  config:
    logLevel: INFO
    host: "0.0.0.0"
    port: "8000"
    dataPath: "/data"
    bucketName: "aas-files"

  # When set, MCPServer metadata.name is this value so ARK discovers tools under this name
  # (e.g. "mcp-filesystem" so agents that expect mcp-filesystem-* tools work without standalone MCP).
  mcpserverName: ""

fileApi:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/mckinsey/agents-at-scale-marketplace/file-api
    pullPolicy: IfNotPresent
    tag: "latest"

  serviceAccount:
    create: true
    name: ""

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 80

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  config:
    host: "0.0.0.0"
    port: "8080"
    # S3 bucket file-api serves. Empty = fall back to filesystemMcp.config.bucketName.
    # IMPORTANT: when versitygw.backend=s3 this MUST name an existing upstream bucket
    # (nothing in the chart auto-creates it); the default "aas-files" will not exist
    # in a real S3 account and requests will fail with NoSuchBucket.
    bucketName: ""

  cors:
    origins: "http://localhost:3000"
    allowCredentials: true
    allowMethods: "*"
    allowHeaders: "*"
