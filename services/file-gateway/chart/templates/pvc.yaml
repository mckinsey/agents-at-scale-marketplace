{{- /* No PVC in s3 mode: nothing mounts it (versitygw proxies remote S3 and
       filesystem-mcp is disabled), so gate it out by construction. */}}
{{- if and .Values.storage.enabled (ne .Values.versitygw.backend "s3") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "file-gateway.pvcName" . }}
  labels:
    {{- include "file-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  accessModes:
    {{- range .Values.storage.accessModes }}
    - {{ . }}
    {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
  {{- if .Values.storage.storageClassName }}
  storageClassName: {{ .Values.storage.storageClassName }}
  {{- end }}
{{- end }}
