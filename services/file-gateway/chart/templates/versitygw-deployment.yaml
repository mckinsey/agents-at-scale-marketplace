{{- if .Values.versitygw.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "file-gateway.fullname" . }}-versitygw
  labels:
    {{- include "file-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: versitygw
spec:
  replicas: {{ .Values.versitygw.replicaCount }}
  selector:
    matchLabels:
      {{- include "file-gateway.versitygw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "file-gateway.versitygw.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "file-gateway.versitygw.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.versitygw.podSecurityContext | nindent 8 }}
      {{- if ne .Values.versitygw.backend "s3" }}
      initContainers:
      - name: fix-data-permissions
        image: busybox:1.37.0
        command: ['sh', '-c', 'mkdir -p {{ .Values.versitygw.config.dataPath }}/{{ .Values.filesystemMcp.config.bucketName }}']
        volumeMounts:
        - name: data
          mountPath: {{ .Values.versitygw.config.dataPath }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
      {{- end }}
      containers:
      - name: versitygw
        securityContext:
          {{- toYaml .Values.versitygw.securityContext | nindent 12 }}
        image: "{{ .Values.versitygw.image.repository }}:{{ .Values.versitygw.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.versitygw.image.pullPolicy }}
        args:
        {{- if eq .Values.versitygw.backend "s3" }}
          - "s3"
        {{- else }}
          - "posix"
          - {{ .Values.versitygw.config.dataPath | quote }}
        {{- end }}
        ports:
        - name: s3
          containerPort: {{ .Values.versitygw.config.port | int }}
          protocol: TCP
        env:
        - name: ROOT_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "file-gateway.s3SecretName" . }}
              key: access-key-id
        - name: ROOT_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "file-gateway.s3SecretName" . }}
              key: secret-access-key
        - name: VGW_PORT
          value: {{ printf ":%s" .Values.versitygw.config.port | quote }}
        # VGW_REGION is a root-level gateway flag (the region the gateway presents to
        # its own clients). It applies in both backends and is independent of the
        # upstream VGW_S3_REGION, so it must be set regardless of backend.
        - name: VGW_REGION
          value: {{ .Values.versitygw.config.region | quote }}
        {{- if eq .Values.versitygw.backend "s3" }}
        - name: VGW_S3_REGION
          value: {{ .Values.versitygw.s3Backend.region | quote }}
        {{- if .Values.versitygw.s3Backend.endpoint }}
        - name: VGW_S3_ENDPOINT
          value: {{ .Values.versitygw.s3Backend.endpoint | quote }}
        {{- end }}
        {{- if .Values.versitygw.s3Backend.usePathStyle }}
        - name: VGW_S3_USE_PATH_STYLE
          value: "true"
        {{- end }}
        # HOME is needed by the AWS SDK default credential chain (IRSA / pod identity)
        # for optional shared config lookups when no credentialsSecret is set.
        - name: HOME
          value: /tmp
        {{- if .Values.versitygw.s3Backend.credentialsSecret }}
        # Upstream credentials passed explicitly to the s3 backend as long-lived keys.
        # When credentialsSecret is empty the gateway instead uses the AWS default
        # credential chain (IRSA / pod identity), gated by allowDefaultCredentialChain.
        - name: VGW_S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.versitygw.s3Backend.credentialsSecret }}
              key: AWS_ACCESS_KEY_ID
        - name: VGW_S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.versitygw.s3Backend.credentialsSecret }}
              key: AWS_SECRET_ACCESS_KEY
        {{- end }}
        {{- else }}
        volumeMounts:
        - name: data
          mountPath: {{ .Values.versitygw.config.dataPath }}
        {{- end }}
        resources:
          {{- toYaml .Values.versitygw.resources | nindent 12 }}
      {{- if ne .Values.versitygw.backend "s3" }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "file-gateway.pvcName" . }}
      {{- end }}
{{- end }}
