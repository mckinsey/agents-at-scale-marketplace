{{- if .Values.masterKey }}
# Created only when masterKey is supplied at install time. If you manage the
# master key out-of-band, leave masterKey empty and point
# litellm-helm.masterkeySecretName at your own Secret instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.masterKeySecretName }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  {{ .Values.masterKeySecretKey }}: {{ .Values.masterKey | quote }}
{{- end }}
