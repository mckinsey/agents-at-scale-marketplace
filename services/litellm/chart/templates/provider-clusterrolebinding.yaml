{{- if and .Values.modelProvider.enabled .Values.modelProvider.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Chart.Name }}-model-provider
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-model-provider
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Chart.Name }}-model-provider
subjects:
  - kind: ServiceAccount
    name: {{ .Values.modelProvider.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
