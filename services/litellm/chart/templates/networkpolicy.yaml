{{- if .Values.networkPolicy.enabled }}
# Restrict who can reach the proxy. Provider secrets live behind this port, so
# only the ark-system namespace and explicitly-labelled namespaces may connect.
# Egress is left open so the proxy can call upstream LLM providers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Chart.Name }}-ingress
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      # Target the proxy pod only — the bundled Postgres shares the instance
      # label but carries app.kubernetes.io/name: postgresql.
      app.kubernetes.io/name: litellm
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Callers in the system namespace (e.g. the Ark controller).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
        # Tenant namespaces opted in via label.
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.accessLabel }}: "true"
      ports:
        - protocol: TCP
          port: 4000
{{- end }}
