{{- if .Values.modelProvider.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-model-provider
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-model-provider
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  # Single replica: the reconcile loop is not safe to run concurrently.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-model-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-model-provider
      annotations:
        # Roll the pod when config changes so new targets take effect.
        checksum/config: {{ include (print $.Template.BasePath "/provider-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.modelProvider.serviceAccount.name }}
      containers:
        - name: provider
          image: "{{ .Values.modelProvider.image.repository }}:{{ .Values.modelProvider.image.tag }}"
          imagePullPolicy: {{ .Values.modelProvider.image.pullPolicy }}
          env:
            - name: CONFIG_PATH
              value: /etc/litellm-model-provider/config.yaml
            # Identity for the model-provider provenance annotation.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PROVIDER_NAME
              value: {{ .Chart.Name }}-model-provider
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.modelProvider.litellm.masterKeySecret.name }}
                  key: {{ .Values.modelProvider.litellm.masterKeySecret.key }}
          volumeMounts:
            - name: config
              mountPath: /etc/litellm-model-provider
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Chart.Name }}-model-provider-config
{{- end }}
