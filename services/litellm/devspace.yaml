# DevSpace configuration for LiteLLM (proxy + model provider in one service)
version: v2beta1

vars:
  HTTPROUTE_ENABLED:
    command: |-
      if kubectl get crd httproutes.gateway.networking.k8s.io >/dev/null 2>&1; then
        echo "true"
      else
        echo "false"
      fi

images:
  litellm-model-provider:
    image: litellm-model-provider
    dockerfile: Dockerfile
    context: .

pipelines:
  deploy: |-
    build_images --all
    create_deployments --all
  dev: |-
    build_images --all
    create_deployments --all
    start_dev --all

deployments:
  litellm:
    namespace: ark-system
    helm:
      chart:
        path: ./chart
      values:
        # masterKey (sk-1234) and dashboard login (admin/admin) come from the
        # chart's dev defaults — no override needed.
        httpRoute:
          # when true, UI at http://litellm.ark-system.127.0.0.1.nip.io:8080/ui
          enabled: ${HTTPROUTE_ENABLED}
        modelProvider:
          image:
            repository: ${runtime.images.litellm-model-provider.image}
            tag: ${runtime.images.litellm-model-provider.tag}
          # Sync into the default namespace for local testing.
          targets:
            - namespace: default

dev:
  litellm-model-provider:
    imageSelector: litellm-model-provider
    namespace: ark-system
    # Live reload (same pattern as services/file-gateway): `command` makes
    # devspace inject its restart helper, and a plain `sync` restarts the process
    # on edit. Run the venv python directly so there's no uv resolution step.
    command: ["/app/.venv/bin/python", "-m", "litellm_model_provider"]
    sync:
      - path: ./src/litellm_model_provider:/app/src/litellm_model_provider
        excludePaths:
          - "**/__pycache__"
          - "**/*.pyc"
        printLogs: true
    logs:
      lastLines: 50

hooks:
  # Dev-only: seed a dummy provider secret so the proxy boots without real keys.
  # Only created when ABSENT — so a real key you set later survives redeploys.
  # Replace with a real key for live completions:
  #   kubectl create secret generic litellm-provider-secrets -n ark-system \
  #     --from-literal=OPENAI_API_KEY=sk-... --dry-run=client -o yaml | kubectl apply -f -
  #   kubectl rollout restart deploy/litellm -n ark-system
  - command: |-
      kubectl create namespace ark-system --dry-run=client -o yaml | kubectl apply -f -
      kubectl get secret litellm-provider-secrets -n ark-system >/dev/null 2>&1 || \
        kubectl create secret generic litellm-provider-secrets -n ark-system \
          --from-literal=OPENAI_API_KEY=sk-dummy-dev-key
    events: ["before:deploy:litellm"]
  - command: |-
      echo "LiteLLM in-cluster: http://litellm.ark-system.svc.cluster.local:4000"
      echo "Admin UI (route):   http://litellm.ark-system.127.0.0.1.nip.io:8080/ui"
      echo "Port-forward:        kubectl port-forward -n ark-system svc/litellm 4000:4000  (then /ui)"
      echo "Provider logs:      kubectl logs -n ark-system deploy/litellm-model-provider -f"
      echo "Synced models:      kubectl get models -n default"
    events: ["after:deploy:litellm"]
