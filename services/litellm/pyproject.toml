[project]
name = "litellm-model-provider"
# Version is managed via Release Please
version = "0.1.0"
description = "Reconciles Ark Model resources and scoped LiteLLM virtual keys into tenant namespaces"
authors = [
    {name = "McKinsey Agent Platform Team"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0", # LiteLLM admin/inference HTTP client
    "pydantic>=2.0.0", # data validation
    "pydantic-settings>=2.0.0", # environment variable config
    "pyyaml>=6.0", # config file parsing
    # Pin <36 to avoid the system:anonymous auth regression (see ark core #292)
    "kubernetes>=32.0.0,<36.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/mckinsey/agents-at-scale-marketplace"
Documentation = "https://mckinsey.github.io/agents-at-scale-marketplace/services/litellm/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pyright>=1.1.402",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
litellm-model-provider = "litellm_model_provider.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/litellm_model_provider"]

# Black configuration - follow AI developer guide for 120 char line length
[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'

# Flake8 configuration - allow 120 character lines per AI developer guide
[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]

# isort configuration
[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true

# MyPy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# Pytest configuration
[tool.pytest.ini_options]
pythonpath = [
    "src"
]
testpaths = [
    "tests"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
