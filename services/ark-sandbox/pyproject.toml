[project]
name = "ark-sandbox"
version = "0.1.0"
description = "ARK Sandbox - Kubernetes controller and MCP server for managing isolated dev sandbox containers"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.5",
    "kubernetes>=36.0.3",
    "kopf>=1.44.6",
    "uvicorn>=0.52.1",
    "starlette>=1.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

